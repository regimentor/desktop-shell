#bar-design{--base:#1e1e2e;--surface:#313244;--text:#cdd6f4;--muted:#a6adc8;--accent:#cba6f7;--border:#45475a;color:var(--text);font:13px BarMonoid,Monoid,monospace;width:100%}
#bar-design *{box-sizing:border-box}
#bar-design button,#bar-design select{font:inherit;color:inherit}
#bar-design button{cursor:pointer}
#bar-design .viewport{position:relative;width:100%;overflow:hidden;background:#11111b}
#bar-design .desktop{position:absolute;transform-origin:top left;height:350px;background:radial-gradient(ellipse at 70% 100%,#29283f 0%,#181825 65%);overflow:hidden}
#bar-design .panel{position:absolute;top:6px;left:6px;right:6px;height:30px;border:1px solid var(--border);border-radius:12px;background:var(--base);box-shadow:0 5px 14px #11111b80;display:flex;align-items:center;padding:0 7px;gap:7px;font-size:12px;z-index:2}
#bar-design .workspaces{display:flex;align-items:center;gap:4px;flex:none;white-space:nowrap}
#bar-design .workspace{display:flex;align-items:center;gap:3px;padding:0 5px;height:24px;border-radius:5px;flex:none}
#bar-design .workspace.active{background:var(--surface)}
#bar-design .workspace.special{margin-left:4px;border-left:1px solid var(--border);border-radius:0;padding-left:10px}
#bar-design .workspace.special.active{border-radius:7px}
#bar-design .number{padding:0;border:0;background:none;color:var(--muted);min-width:10px;height:22px}
#bar-design .active .number{color:var(--accent)}
#bar-design .app{position:relative;padding:0;border:0;background:none;width:16px;height:22px;display:flex;align-items:center;justify-content:center;flex:none}
#bar-design .app img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}
#bar-design .app.focused:after{content:'';position:absolute;bottom:0;left:30%;right:30%;height:2px;background:var(--accent);border-radius:2px}
#bar-design .app.urgent:after{content:'';position:absolute;top:0;right:-1px;width:4px;height:4px;border-radius:50%;background:#f9e2af}
#bar-design .window-title{position:absolute;left:50%;transform:translateX(-50%);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);line-height:24px;pointer-events:auto}
#bar-design .right{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none;height:100%;white-space:nowrap}
#bar-design .tray{display:flex;align-items:center;gap:6px}
#bar-design .tray img{width:14px;height:14px;object-fit:contain}
#bar-design .lang{padding:0 7px;background:none;border:0;border-left:1px solid var(--border);border-right:1px solid var(--border);color:var(--accent);height:16px;min-width:32px}
#bar-design .clock{display:flex;align-items:center;gap:9px;color:var(--text)}
#bar-design .clock span:first-child{color:var(--muted)}
#bar-design .desktop[data-variant=B] .panel{background:none;border:0;box-shadow:none;padding:0}
#bar-design .desktop[data-variant=B] .workspaces,#bar-design .desktop[data-variant=B] .right,#bar-design .desktop[data-variant=B] .window-title{height:100%;background:var(--base);border:1px solid var(--border);border-radius:12px;padding:0 10px;box-shadow:0 5px 14px #11111b80}
#bar-design .desktop[data-variant=B] .window-title{line-height:38px}
#bar-design .desktop[data-variant=C] .panel{top:0;left:0;right:0;border:0;border-bottom:1px solid var(--border);border-radius:0;box-shadow:none}
#bar-design .desktop[data-variant=C] .workspace{border-radius:0;height:100%}
#bar-design .desktop[data-variant=C] .workspaces{height:100%}
#bar-design .desktop[data-variant=C] .workspace.active{box-shadow:inset 0 -2px var(--accent)}
#bar-design .sample-window{position:absolute;top:94px;left:15%;width:70%;height:228px;background:var(--base);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 35px #11111b80;overflow:hidden}
#bar-design .sample-heading{height:35px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
#bar-design .sample-body{padding:22px 24px;line-height:24px;white-space:pre-wrap;color:var(--muted)}
#bar-design .sample-body .prompt{color:var(--accent)}
#bar-design .sample-body .cursor{display:inline-block;width:8px;height:14px;background:var(--accent);vertical-align:middle}
#bar-design .meta{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;color:var(--muted);font-size:11px;line-height:18px}
#bar-design .controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;background:#181825;border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:12px}
#bar-design .variants{display:flex;align-items:center;gap:8px}
#bar-design .controls button{border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:6px 10px;min-width:34px;min-height:32px}
#bar-design .controls select{background:var(--base);border:1px solid var(--border);border-radius:7px;padding:6px;max-width:100%;min-height:32px}
#bar-design .controls label{display:flex;align-items:center;gap:6px;font-size:11px}
#bar-design .variant-name{min-width:167px;text-align:center}
#bar-design .state{color:var(--muted);font-size:11px;line-height:18px;margin-top:10px;min-height:18px}
@media(max-width:500px){#bar-design .controls{justify-content:flex-start}#bar-design .variants{width:100%;justify-content:center}}
</style>

const names=['A · Цельная','B · Три блока','C · Компактная'];
const profiles=[{height:30,margin:6,radius:8,icon:16},{height:30,margin:6,radius:8,icon:16},{height:26,margin:0,radius:0,icon:15}];
const initial=new URLSearchParams(location.search).get('variant');
const state={variant:['A','B','C'].includes(initial)?initial:'A',scene:'normal',width:1024,height:30,margin:6,radius:8,icon:16,active:'2',focused:'2-0',lang:'EN'};
const viewport=root.querySelector('.viewport'),desktop=root.querySelector('.desktop'),panel=root.querySelector('.panel'),workspaces=root.querySelector('.workspaces'),right=root.querySelector('.right'),heading=root.querySelector('.window-title');
const apps=[{name:'Firefox',key:'firefox',title:'Hyprland — Mozilla Firefox'},{name:'kitty',key:'kitty',title:'~/Projects/daevox-shell — kitty'},{name:'Telegram',key:'telegram',title:'Telegram'},{name:'Discord',key:'discord',title:'Discord'},{name:'Chromium',key:'chromium',title:'Документация — Chromium'}];
let windows=[];
function imageFor(key){const img=document.createElement('img');img.src=assets[key];img.alt='';return img;}
function updateURL(){try{const url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);}catch{}}
function describe(text){root.querySelector('.state').textContent=text;}

 workspaces.replaceChildren();windows=[];
 let groups=state.scene==='crowded'?[['1',10],['2',8],['3',7],['4',4],['S',1]]:[['1',3],['2',2],['3',2],['S',1]];
 if(state.scene==='empty')groups=[['1',3],['2',0],['3',2],['S',1]];
 if(state.scene==='special')groups=[['1',3],['2',2],['3',2],['term',1],['notes',1]];
 for(const [id,count] of groups){
  const group=document.createElement('div');group.className='workspace'+(id===state.active?' active':'')+(/^[0-9]+$/.test(id)?'':' special');group.dataset.workspace=id;
  const label=document.createElement('button');label.type='button';label.className='number';label.textContent=id;label.setAttribute('aria-label','Воркспейс '+id);label.setAttribute('aria-pressed',String(id===state.active));
  label.onclick=()=>{state.active=id;state.focused=count?id+'-0':null;render();};group.append(label);
  group.onclick=e=>{if(e.target===group)label.click();};
  for(let i=0;i<count;i++){
   const app=id==='2'?apps[i%2===0?1:0]:id==='1'?apps[i%3===0?4:0]:id==='3'?apps[i%2===0?2:3]:apps[1];
   const key=id+'-'+i;windows.push({...app,id:key,workspace:id});
   const button=document.createElement('button');button.type='button';button.className='app'+(state.focused===key?' focused':'')+(id==='3'&&i===0?' urgent':'');button.dataset.window=key;
   button.setAttribute('aria-label',app.name+' — окно '+(i+1));button.setAttribute('data-tooltip',app.title+' · окно '+(i+1));button.append(imageFor(app.key));
   button.onclick=()=>{state.active=id;state.focused=key;render();};group.append(button);
  }
  workspaces.append(group);
 }
 const current=windows.find(w=>w.id===state.focused);
 heading.textContent=current?current.title:'';heading.setAttribute('data-tooltip',heading.textContent);

 root.querySelector('.lang').textContent=state.lang;
 const tray=root.querySelector('.tray');tray.replaceChildren();
 for(const [key,label] of [['telegram','Telegram'],['discord','Discord'],['obs','OBS Studio']]){const item=document.createElement('span');item.setAttribute('data-tooltip',label);item.setAttribute('aria-label',label);item.append(imageFor(key));tray.append(item);}

}
function layout(){
 const scale=Math.min(1,viewport.clientWidth/state.width);desktop.style.transform='scale('+scale+')';viewport.style.height=Math.round(350*scale)+'px';
 const groups=[...workspaces.children],buttons=[...workspaces.querySelectorAll('.app')];
 let size=state.icon,gap=3,pad=5,groupGap=2;
 function apply(){workspaces.style.gap=groupGap+'px';groups.forEach(g=>{g.style.gap=gap+'px';g.style.paddingLeft=(g.classList.contains('special')?pad+3:pad)+'px';g.style.paddingRight=pad+'px';});buttons.forEach(b=>b.style.width=size+'px');}
 apply();
 const available=panel.clientWidth-right.offsetWidth-24;
 if(workspaces.offsetWidth>available){gap=1;pad=3;groupGap=2;apply();}
 if(workspaces.offsetWidth>available){size=Math.max(1,size-(workspaces.offsetWidth-available)/Math.max(1,buttons.length)-0.1);apply();}
 const p=panel.getBoundingClientRect(),l=workspaces.getBoundingClientRect(),r=right.getBoundingClientRect();
 const mid=p.left+p.width/2;const titleWidth=Math.max(0,2*Math.min(mid-l.right-10*scale,r.left-mid-10*scale)/scale);
 heading.style.width=titleWidth+'px';heading.style.display=titleWidth<30?'none':'';

 describe('Воркспейс '+state.active+' · '+(heading.textContent||'нет активного окна')+' · '+state.lang+(heading.style.display==='none'&&heading.textContent?' · заголовок скрыт':'')+' · демонстрационные данные');

function switchVariant(delta){const keys=['A','B','C'];state.variant=keys[(keys.indexOf(state.variant)+delta+3)%3];Object.assign(state,profiles[keys.indexOf(state.variant)]);updateURL();render();}

root.querySelector('.lang').onclick=()=>{state.lang=state.lang==='EN'?'RU':'EN';render();};
